name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync deps (locked)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests scripts

      # The market parquet is gitignored, so data-dependent tests skip here by
      # design (they run locally with the bundled data). CI validates the
      # deterministic core — LP dispatch, CVaR, PICASSO buffer, metrics.
      - name: Tests
        run: uv run pytest -q
